# Configuration for the container smoke test (test/container/smoke.sh).

[sources.static]
adapter = "file"
match = "path"
root = "/data/images"
root_id = "static"

# Long enough for the draining check to see readiness fail and Docker mark the
# container unhealthy, even when SIGTERM reaches the server late.
[server]
shutdown_delay = 15000

# The stats endpoints report this cache, on the container's tmpfs, and the
# space left on it.
[cache.output]
root = "/tmp/image-pipe-cache"
max_size_bytes = 10000000

[stats]
enabled = true
token = "smoke-stats-token"
