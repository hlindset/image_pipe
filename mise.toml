[tools]
erlang = "29"
elixir = "1.20.0-otp-29"
node = "latest"
rust = "1.91"
python = "3.14.6"
uv = "0.11.23"
"pipx:shot-scraper" = "1.9.1"

[settings]
# python-build-standalone defaults to a freethreaded build for 3.14, whose layout
# trips mise ("missing a `lib` directory"); the standard build installs cleanly.
python.precompiled_flavor = "install_only"

[tasks.setup]
description = "Install library and fiddle dependencies"
run = [
  "mix deps.get",
  "cd fiddle && mix deps.get",
  "pnpm -C fiddle install --frozen-lockfile",
  "pnpm -C fiddle/assets run build",
]

# Full imgproxy differential bake (requires Docker). Wraps the whole dance so no
# manual IMGPROXY_DIFF / Ryuk / recompile juggling is needed:
#   - IMGPROXY_DIFF=1 gates the testcontainers dep AND the env-gated gen_fixtures task
#     module; --force is required because toggling the flag doesn't trigger a recompile.
#   - TESTCONTAINERS_RYUK_DISABLED=true: Ryuk (the testcontainers reaper) fails on some
#     local Docker setups; the bake tears its own container down, so this is a no-op
#     where Ryuk works and a fix where it doesn't.
#   - the trailing flag-less `compile --force` restores the default-lane build so a
#     plain `mix test` doesn't see the now-stale generator module.
# `env VAR=val` prefixes keep this shell-agnostic (the run lines are not fish-safe inline).
[tasks."diff:bake"]
description = "Regenerate imgproxy differential fixtures + manifest + REPORT against the pinned container (requires Docker)"
env = { MIX_ENV = "test" }
run = [
  "env IMGPROXY_DIFF=1 mix deps.get",
  "env IMGPROXY_DIFF=1 mix compile --force",
  "env IMGPROXY_DIFF=1 TESTCONTAINERS_RYUK_DISABLED=true mix imgproxy.gen_fixtures",
  "mix compile --force",
]

[tasks.precommit]
description = "Elixir library checks: format, compile (warnings as errors), credo, dialyzer, duplication, test"
run = [
  "mix format --check-formatted",
  "mix compile --warnings-as-errors",
  "mix credo --strict",
  "mix dialyzer",
  # Both this standalone gate and ExDNA.Credo consume the authoritative options
  # from ImagePipe.MixProject.ex_dna_options/0.
  "mix image_pipe.ex_dna",
  "mix test",
]

[tasks."precommit:fiddle"]
description = "Library checks plus the fiddle verify suite"
depends = ["precommit"]
run = [
  "cd fiddle && mix format --check-formatted",
  "cd fiddle && mix compile --warnings-as-errors",
  "cd fiddle && mix test",
  "pnpm -C fiddle/assets run test",
  "pnpm -C fiddle/assets run check",
  "pnpm -C fiddle/assets run format:check",
  "pnpm -C fiddle/assets run lint",
  "pnpm -C fiddle/assets run build",
]

# Thin alias so the task shows up in `mise tasks`; the implementation (and its
# symlink-safety logic) lives in the `mix worktrees.clean` task, which selects
# MIX_ENV=test itself via mix.exs `preferred_envs`.
[tasks."worktrees:clean"]
description = "Remove regenerable dirs (deps, _build, fiddle deps/_build/node_modules, .dexter, .expert) from every worktree (→ mix worktrees.clean)"
run = "mix worktrees.clean"

[tasks.fiddle]
description = "Run the ImagePipe Fiddle dev server (Phoenix + Vite). Pass `otel` to enable OpenTelemetry tracing (start `mise run fiddle:sidecars jaeger` first)."
dir = "fiddle"
run = """
if [ "{{arg(name='mode', var=true, required=false)}}" = "otel" ]; then
  export FIDDLE_OTEL=1
fi
exec mix phx.server
"""

[tasks."fiddle:sidecars"]
description = "Run the fiddle's local sidecars (Jaeger + s3proxy). Defaults to both; pass a service to run just one, e.g. `mise run fiddle:sidecars s3proxy`."
run = "docker compose -f fiddle/docker-compose.yml up {{arg(name='service', var=true, required=false)}}"
