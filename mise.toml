[tools]
erlang = "29.1.1"
elixir = "1.20.4-otp-29"
node = "26.10.0"
pnpm = "12.8.1"
rust = "1.98.1"
python = "3.14.7"
uv = "0.12.21"
"pipx:shot-scraper" = "1.9.1"

[settings]
# python-build-standalone defaults to a freethreaded build for 3.14, whose layout
# trips mise ("missing a `lib` directory"); the standard build installs cleanly.
python.precompiled_flavor = "install_only"

[tasks.setup]
description = "Install library, server, and fiddle dependencies"
run = [
  "cd image_pipe_url && mix deps.get",
  "cd image_pipe && mix deps.get",
  "cd image_pipe_server && mix deps.get",
  "cd fiddle && mix deps.get",
  "pnpm -C fiddle install --frozen-lockfile",
  "pnpm -C fiddle/assets run build",
]

[tasks."precommit:url"]
description = "image_pipe_url checks: format, compile (warnings as errors), credo, dialyzer, test"
dir = "image_pipe_url"
run = [
  "mix format --check-formatted",
  "mix compile --warnings-as-errors",
  "mix credo --strict",
  "mix dialyzer",
  "mix test",
]

[tasks.precommit]
description = "Elixir checks for image_pipe_url and the library: format, compile (warnings as errors), credo, dialyzer, duplication, test"
depends = ["precommit:url"]
dir = "image_pipe"
run = [
  # The projects release in lockstep; image_pipe pins image_pipe_url with ==.
  "../scripts/check-versions.sh > /dev/null",
  "mix format --check-formatted",
  "mix compile --warnings-as-errors",
  "mix credo --strict",
  "mix dialyzer",
  # Both this standalone gate and ExDNA.Credo consume the authoritative options
  # from ImagePipe.MixProject.ex_dna_options/0.
  "mix image_pipe.ex_dna",
  "mix test",
]

[tasks."release:hex"]
description = "Publish image_pipe_url and image_pipe to Hex; pass --dry-run to only build and check them"
run = "elixir scripts/release_hex.exs"

[tasks."precommit:server"]
description = "Library checks plus the image_pipe_server checks: format, compile (warnings as errors), test"
depends = ["precommit"]
dir = "image_pipe_server"
run = [
  "mix format --check-formatted",
  "mix compile --warnings-as-errors",
  "mix test",
]

[tasks."server:image"]
description = "Build the image_pipe_server Docker image and run the container smoke test. Pass `vision` for the detection variant."
run = """
variant="{{arg(name='variant', var=true, required=false)}}"
vision=0
tag=image_pipe_server:dev
if [ "$variant" = "vision" ]; then
  vision=1
  tag=image_pipe_server:dev-vision
fi
docker build -f image_pipe_server/Dockerfile --build-arg IMAGE_VISION=$vision -t $tag .
image_pipe_server/test/container/smoke.sh $tag ${variant:-base}
"""

[tasks."precommit:fiddle"]
description = "Library checks plus the fiddle verify suite"
depends = ["precommit"]
run = [
  "cd fiddle && mix format --check-formatted",
  "cd fiddle && mix compile --warnings-as-errors",
  "cd fiddle && mix test",
  "pnpm -C fiddle/assets run test",
  "pnpm -C fiddle/assets run check",
  "pnpm -C fiddle/assets run format:check",
  "pnpm -C fiddle/assets run lint",
  "pnpm -C fiddle/assets run build",
]

# Thin alias so the task shows up in `mise tasks`; the implementation (and its
# symlink-safety logic) lives in the `mix worktrees.clean` task, which selects
# MIX_ENV=test itself via mix.exs `preferred_envs`.
[tasks."worktrees:clean"]
description = "Remove regenerable dirs (image_pipe, image_pipe_url and fiddle deps/_build, node_modules, .dexter, .expert) from every worktree (→ mix worktrees.clean)"
dir = "image_pipe"
run = "mix worktrees.clean"

[tasks.fiddle]
description = "Run the ImagePipe Fiddle dev server (Phoenix + Vite). Pass `otel` to enable OpenTelemetry tracing (start `mise run fiddle:sidecars jaeger` first)."
dir = "fiddle"
run = """
if [ "{{arg(name='mode', var=true, required=false)}}" = "otel" ]; then
  export FIDDLE_OTEL=1
fi
exec mix phx.server
"""

[tasks."fiddle:sidecars"]
description = "Run the fiddle's local sidecars (Jaeger + s3proxy). Defaults to both; pass a service to run just one, e.g. `mise run fiddle:sidecars s3proxy`."
run = "docker compose -f fiddle/docker-compose.yml up {{arg(name='service', var=true, required=false)}}"
