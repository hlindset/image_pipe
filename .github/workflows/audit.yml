name: Audit

# Checks every lockfile against the OSV advisory database. Runs nightly as well
# as on lockfile changes, because advisories appear without any change here.
on:
  push:
    branches: ["main"]
    paths: &audit_paths
      - "**/mix.lock"
      - "**/Cargo.lock"
      - "**/pnpm-lock.yaml"
      - "mise.toml"
      - ".github/workflows/audit.yml"
  pull_request:
    branches: ["main"]
    paths: *audit_paths
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scanner:
    name: osv-scanner
    runs-on: ubuntu-26.04
    env:
      # Use only the tools mise-action installs, not every tool in mise.toml.
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: osv-scanner
      - name: Scan lockfiles
        run: mise run audit
