name: Server CI

on:
  push:
    branches: ["main"]
    paths: &server_paths
      - "image_pipe_url/lib/**"
      - "image_pipe_url/mix.exs"
      - "image_pipe_url/mix.lock"
      - "image_pipe/lib/**"
      - "image_pipe/priv/icc/**"
      - "image_pipe/mix.exs"
      - "image_pipe/mix.lock"
      - "image_pipe_server/**"
      - "mise.toml"
      - ".github/workflows/server.yml"
  pull_request:
    branches: ["main"]
    paths: *server_paths

permissions:
  contents: read

jobs:
  test:
    name: image_pipe_server tests
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    defaults:
      run:
        working-directory: image_pipe_server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - name: Install Hex
        run: mise exec -- mix local.hex --force
      - name: Install Rebar
        run: mise exec -- mix local.rebar --force
      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            image_pipe_server/deps
            image_pipe_server/_build
          key: server-mix-${{ runner.os }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('image_pipe_server/mix.lock') }}
          restore-keys: |
            server-mix-${{ runner.os }}-${{ hashFiles('mise.toml') }}-
      - name: Install dependencies
        run: mise exec -- mix deps.get
      - name: Check formatting
        run: mise exec -- mix format --check-formatted
      - name: Compile
        run: mise exec -- mix compile --warnings-as-errors
      - name: Run tests
        run: mise exec -- mix test --no-compile

  image:
    name: Docker image (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [base, vision]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image_pipe_server/Dockerfile
          build-args: IMAGE_VISION=${{ matrix.variant == 'vision' && '1' || '0' }}
          tags: image_pipe_server:ci
          load: true
          cache-from: type=gha,scope=server-${{ matrix.variant }}
          cache-to: type=gha,scope=server-${{ matrix.variant }},mode=max
      - name: Smoke test
        run: image_pipe_server/test/container/smoke.sh image_pipe_server:ci ${{ matrix.variant }}
