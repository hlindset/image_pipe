name: SVG package CI

on:
  push:
    branches: ["main"]
    paths: &svg_paths
      - "image_pipe_svg/**"
      - "!image_pipe_svg/bench/**"
      - "mise.toml"
      - ".github/workflows/svg.yml"
  pull_request:
    branches: ["main"]
    paths: *svg_paths
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A push to a pull request, or adding or removing its skip-tests or full-ci
# label, cancels the run in progress. Other label events and pushes to main
# get a group of their own.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || contains(fromJSON('["skip-tests", "full-ci"]'), github.event.label.name))
    && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: image_pipe_svg / Elixir ${{ matrix.toolchain.elixir }} / OTP ${{ matrix.toolchain.erlang }}
    # Skipped on a pull request labeled skip-tests and on events for other labels.
    if: >-
      github.event_name != 'pull_request'
      || !contains(github.event.pull_request.labels.*.name, 'skip-tests')
      && (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || contains(fromJSON('["skip-tests", "full-ci"]'), github.event.label.name))
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test the newest toolchain; pushes to main and pull
        # requests labeled full-ci test all three.
        toolchain: >-
          ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci'))
          && '[{"elixir": "1.18.5-otp-27", "erlang": "27"}, {"elixir": "1.19.6-otp-28", "erlang": "28"}, {"elixir": "1.20.4-otp-29", "erlang": "29.1.1", "lint": true}]'
          || '[{"elixir": "1.20.4-otp-29", "erlang": "29.1.1", "lint": true}]') }}
    env:
      MISE_ERLANG_VERSION: ${{ matrix.toolchain.erlang }}
      MISE_ELIXIR_VERSION: ${{ matrix.toolchain.elixir }}
      # Use only the tools mise-action installs, not every tool in mise.toml.
      MISE_EXEC_AUTO_INSTALL: "false"
      MIX_ENV: test
    defaults:
      run:
        working-directory: image_pipe_svg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches holding compiled code are keyed by runner image (e.g. ubuntu26).
      - name: Runner image
        id: runner
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          # Workaround: mise (2026.9.18) maps ImageOS to builds.hex.pm's Erlang
          # builds only up to ubuntu24 and compiles from source otherwise, so
          # name the release. Remove once mise maps ubuntu26 itself
          # (linux_precompiled_os_version in src/plugins/core/erlang.rs).
          echo "MISE_ERLANG_PRECOMPILED_OS=${ImageOS/ubuntu/ubuntu-}.04" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: erlang elixir rust
      - name: Install Hex
        run: mise exec -- mix local.hex --force
      - name: Install Rebar
        run: mise exec -- mix local.rebar --force
      - name: Cache deps, build, and the NIF crate
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            image_pipe_svg/deps
            image_pipe_svg/_build
            image_pipe_svg/native/image_pipe_svg_nif/target
            image_pipe_svg/native/image_pipe_svg_nif/fuzz/target
          key: svg-mix-${{ steps.runner.outputs.image }}-${{ matrix.toolchain.elixir }}-${{ matrix.toolchain.erlang }}-${{ hashFiles('image_pipe_svg/mix.lock', 'image_pipe_svg/native/image_pipe_svg_nif/Cargo.lock', 'image_pipe_svg/native/image_pipe_svg_nif/fuzz/Cargo.lock') }}
          restore-keys: |
            svg-mix-${{ steps.runner.outputs.image }}-${{ matrix.toolchain.elixir }}-${{ matrix.toolchain.erlang }}-
      - name: Install dependencies
        run: mise exec -- mix deps.get
      - name: Compile
        run: mise exec -- mix compile --warnings-as-errors
      - name: Run tests
        run: mise exec -- mix test --no-compile
      - name: Lint
        if: matrix.toolchain.lint
        run: |
          mise exec -- mix format --check-formatted
          mise exec -- mix credo --strict
          cd native/image_pipe_svg_nif
          mise exec -- cargo fmt --check
          mise exec -- cargo clippy --all-targets -- -D warnings
      # Property tests for the checks that read untrusted SVGs before parsing.
      - name: Rust tests
        if: matrix.toolchain.lint
        working-directory: image_pipe_svg/native/image_pipe_svg_nif
        run: mise exec -- cargo test
      # Builds the fuzz targets without cargo-fuzz, which needs nightly, and
      # runs each seed once, so the targets keep compiling and the inputs
      # earlier runs found stay fixed.
      - name: Replay the fuzz seeds
        if: matrix.toolchain.lint
        working-directory: image_pipe_svg/native/image_pipe_svg_nif/fuzz
        env:
          RUSTFLAGS: --cfg fuzzing
        run: |
          mise exec -- cargo build --release --bins --locked
          for target in render expansion templates; do
            "target/release/$target" -runs=0 -timeout=10 -rss_limit_mb=1024 "seeds/$target"
          done
      # Dialyzer rejects a PLT written by another Erlang, so the key names the
      # lint row's toolchain.
      - name: Cache PLTs
        if: matrix.toolchain.lint
        id: plt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: image_pipe_svg/priv/plts
          key: svg-plt-${{ steps.runner.outputs.image }}-${{ matrix.toolchain.elixir }}-${{ matrix.toolchain.erlang }}-${{ hashFiles('image_pipe_svg/mix.lock') }}
          restore-keys: |
            svg-plt-${{ steps.runner.outputs.image }}-${{ matrix.toolchain.elixir }}-${{ matrix.toolchain.erlang }}-
      - name: Create PLTs
        if: matrix.toolchain.lint && steps.plt-cache.outputs.cache-hit != 'true'
        run: mise exec -- mix dialyzer --plt
      - name: Dialyzer
        if: matrix.toolchain.lint
        run: mise exec -- mix dialyzer
