name: Performance

# Times an image_pipe_server image against others on the same runner with
# `mix imgproxy.bench --compare`, alternating between them so the runner's
# speed cancels out:
#
# - On a pull request labelled `perf`, the pull request against its base, on
#   the curated `perf` cases, posted as a comment. Labelled `perf-nightly`,
#   with or without `perf`, the same on the `nightly` cases.
# - Nightly, `main` against the `main` the previous scheduled run measured,
#   the `main` of 30 days earlier, which shows drift too slow to notice night
#   to night, and the latest release image, on the `nightly` cases: the `perf`
#   cases and the slower ImagePipe-only ones.
# - Weekly, `main` against the `main` of 7 days earlier on every case, for a
#   regression in a case the `perf` set leaves out.
# - By hand, like the nightly run, on the cases chosen. Given `against`, the
#   branch run against that commit or branch alone.
#
# One job builds the images, four time a quarter of the rounds each on their
# own runner (`--shard`), and one merges their results (`--merge`). Every
# ratio is measured on one runner, so the shards don't need matching
# machines.
#
# The comparison reports; it doesn't fail the job.
on:
  pull_request:
    types: [labeled, unlabeled, synchronize]
  schedule:
    - cron: "17 3 * * *"
    # The weekly full run. "Choose the commits to compare" matches this string.
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      cases:
        description: Cases to time
        type: choice
        options: [perf, nightly, all]
        default: perf
      against:
        description: >-
          Commit or branch to compare with instead of the previous scheduled
          run, without the month and release images
        type: string
        default: ""

permissions:
  contents: read

# A push to a pull request, or adding or removing its perf or perf-nightly
# label, cancels the run in progress. Other label events get a group of their
# own.
concurrency:
  group: >-
    performance-${{ github.event_name != 'pull_request'
    && (github.event.schedule || github.ref)
    || (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || contains(fromJSON('["perf", "perf-nightly"]'), github.event.label.name))
    && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    # Skipped on a pull request without either label and on events for other
    # labels.
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'perf') || contains(github.event.pull_request.labels.*.name, 'perf-nightly'))
      && (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || contains(fromJSON('["perf", "perf-nightly"]'), github.event.label.name))
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_IMAGE: ghcr.io/hlindset/image_pipe_server:latest
    outputs:
      only: ${{ steps.refs.outputs.only }}
      release: ${{ steps.refs.outputs.release }}
      month: ${{ steps.refs.outputs.month }}
      month_text: ${{ steps.refs.outputs.month_text }}
      against: ${{ steps.refs.outputs.against }}
      name: ${{ steps.refs.outputs.name }}
      candidate_text: ${{ steps.refs.outputs.candidate_text }}
      against_text: ${{ steps.refs.outputs.against_text }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Choose the commits to compare
        id: refs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NIGHTLY: ${{ contains(github.event.pull_request.labels.*.name, 'perf-nightly') }}
          SCHEDULE: ${{ github.event.schedule }}
          CASES: ${{ inputs.cases }}
          AGAINST_REF: ${{ inputs.against }}
        run: |
          # A pull request's checkout is the pull request merged into the base
          # branch as it is now, so its first parent is the base without the
          # pull request. The event's base SHA can be older than that.
          candidate=$(git rev-parse HEAD)
          only=perf
          release=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            release=false
            [ "$PR_NIGHTLY" = true ] && only=nightly
            against=$(git rev-parse HEAD^1)
            name=base
            candidate_text="this pull request at \`${HEAD_SHA:0:7}\`, merged into \`$BASE_REF\`"
            against_text="\`$BASE_REF\` at \`${against:0:7}\`, without this pull request"
          elif [ "$SCHEDULE" = "17 4 * * 0" ]; then
            against=$(git rev-list -1 --first-parent --before="7 days ago" HEAD)
            name=week
            only=all
            release=false
            candidate_text="\`main\` at \`${candidate:0:7}\`"
            against_text="\`main\` at \`${against:0:7}\` from $(git log -1 --format=%cs "$against"), a week earlier"
          elif [ -n "$AGAINST_REF" ]; then
            [ -n "$CASES" ] && only=$CASES
            release=false
            # The checkout has every branch, but only as origin/<branch>.
            against=$(git rev-parse --verify --quiet "$AGAINST_REF^{commit}" ||
              git rev-parse --verify "origin/$AGAINST_REF^{commit}")
            name=against
            candidate_text="\`$GITHUB_REF_NAME\` at \`${candidate:0:7}\`"
            against_text="\`$AGAINST_REF\` at \`${against:0:7}\`"
          else
            only=${CASES:-nightly}
            # The commit the last successful scheduled run measured.
            against=$(gh run list --workflow performance.yml --event schedule \
              --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
            name=previous
            candidate_text="\`main\` at \`${candidate:0:7}\`"
            against_text="\`main\` at \`${against:0:7}\`, from the previous scheduled run"
            month=$(git rev-list -1 --first-parent --before="30 days ago" HEAD)
            # Skipped until main from 30 days earlier has the server image.
            if [ -n "$month" ] && ! git cat-file -e "$month:image_pipe_server/Dockerfile" 2>/dev/null; then
              month=""
            fi
            if [ -n "$month" ]; then
              month_text="\`main\` at \`${month:0:7}\` from $(git log -1 --format=%cs "$month"), a month earlier"
            fi
          fi
          {
            echo "only=$only"
            echo "release=$release"
            echo "month=${month:-}"
            echo "month_text=${month_text:-}"
            echo "candidate=$candidate"
            echo "against=$against"
            echo "name=$name"
            echo "candidate_text=$candidate_text"
            echo "against_text=$against_text"
          } >> "$GITHUB_OUTPUT"
          echo "Candidate $candidate, against $name ${against:-(none yet)}"

      - uses: ./.github/actions/docker-buildx

      - name: Build the candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image_pipe_server/Dockerfile
          tags: image_pipe_server:candidate
          load: true
          cache-from: type=gha,scope=server-base

      - name: Check out the commit to compare against
        if: steps.refs.outputs.against != ''
        run: git worktree add "$RUNNER_TEMP/against" "${{ steps.refs.outputs.against }}"

      - name: Build the image to compare against
        if: steps.refs.outputs.against != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/against
          file: ${{ runner.temp }}/against/image_pipe_server/Dockerfile
          tags: image_pipe_server:against
          load: true
          cache-from: type=gha,scope=server-base

      - name: Check out main from 30 days earlier
        if: steps.refs.outputs.month != ''
        run: git worktree add "$RUNNER_TEMP/month" "${{ steps.refs.outputs.month }}"

      - name: Build main from 30 days earlier
        if: steps.refs.outputs.month != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/month
          file: ${{ runner.temp }}/month/image_pipe_server/Dockerfile
          tags: image_pipe_server:month
          load: true
          cache-from: type=gha,scope=server-base

      - name: Pull the latest release
        if: steps.refs.outputs.release == 'true'
        run: docker pull "$RELEASE_IMAGE"

      # Every shard times these exact images.
      - name: Save the images
        env:
          AGAINST: ${{ steps.refs.outputs.against }}
          MONTH: ${{ steps.refs.outputs.month }}
          RELEASE: ${{ steps.refs.outputs.release }}
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          images=(image_pipe_server:candidate)
          [ -n "$AGAINST" ] && images+=(image_pipe_server:against)
          [ -n "$MONTH" ] && images+=(image_pipe_server:month)
          [ "$RELEASE" = true ] && images+=("$RELEASE_IMAGE")
          for image in "${images[@]}"; do
            file=$(tr ':/' '__' <<<"$image")
            docker save "$image" | gzip -1 > "$RUNNER_TEMP/images/$file.tar.gz"
          done
          ls -lh "$RUNNER_TEMP/images"

      - name: Upload the images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-images
          path: ${{ runner.temp }}/images
          compression-level: 0
          retention-days: 1

  shard:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      # A shard that fails leaves the others' rounds to merge.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Use only the tools mise-action installs, not every tool in mise.toml.
      MISE_EXEC_AUTO_INSTALL: "false"
      # The bench decodes responses only to compare their dimensions, so the
      # libvips bundled with vix is enough; the servers run their own.
      MIX_ENV: test
      RELEASE_IMAGE: ghcr.io/hlindset/image_pipe_server:latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The bench pulls oha and nginx; the mirror spares Docker Hub's limit.
      - uses: ./.github/actions/docker-buildx

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: performance-images
          path: ${{ runner.temp }}/images

      - name: Load the images
        run: for file in "$RUNNER_TEMP"/images/*.tar.gz; do docker load -i "$file"; done

      - name: Runner image
        id: runner
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          # Workaround: mise (2026.9.18) maps ImageOS to builds.hex.pm's Erlang
          # builds only up to ubuntu24 and compiles from source otherwise, so
          # name the release. Remove once mise maps ubuntu26 itself.
          echo "MISE_ERLANG_PRECOMPILED_OS=${ImageOS/ubuntu/ubuntu-}.04" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: erlang elixir rust
      - name: Install Hex and Rebar
        run: |
          mise exec -- mix local.hex --force
          mise exec -- mix local.rebar --force
      - name: Restore deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            image_pipe/deps
            image_pipe/_build
          key: perf-mix-${{ steps.runner.outputs.image }}-${{ hashFiles('mise.toml', 'image_pipe/mix.lock') }}
          restore-keys: |
            perf-mix-${{ steps.runner.outputs.image }}-
      - name: Compile the bench
        working-directory: image_pipe
        run: |
          mise exec -- mix deps.get
          mise exec -- mix compile

      - name: Compare
        working-directory: image_pipe
        env:
          AGAINST: ${{ needs.build.outputs.against }}
          NAME: ${{ needs.build.outputs.name }}
          CANDIDATE_TEXT: ${{ needs.build.outputs.candidate_text }}
          AGAINST_TEXT: ${{ needs.build.outputs.against_text }}
          MONTH: ${{ needs.build.outputs.month }}
          MONTH_TEXT: ${{ needs.build.outputs.month_text }}
          ONLY: ${{ needs.build.outputs.only }}
          RELEASE: ${{ needs.build.outputs.release }}
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: |
          args=(--compare image_pipe_server:candidate --describe "candidate=$CANDIDATE_TEXT")
          if [ -n "$AGAINST" ]; then
            args+=(--against "$NAME=image_pipe_server:against" --describe "$NAME=$AGAINST_TEXT")
          fi
          if [ -n "$MONTH" ]; then
            args+=(--against "month=image_pipe_server:month" --describe "month=$MONTH_TEXT")
          fi
          [ "$ONLY" != all ] && args+=(--only "$ONLY")
          if [ "$RELEASE" = true ]; then
            version=$(docker image inspect --format \
              '{{index .Config.Labels "org.opencontainers.image.version"}}' "$RELEASE_IMAGE")
            release_text="the latest release, \`$RELEASE_IMAGE\`"
            [ -n "$version" ] && release_text="the latest release, \`$version\`"
            args+=(--against "release=$RELEASE_IMAGE" --describe "release=$release_text")
          fi
          # Two CPUs for the servers leave the rest of the runner for oha.
          mise exec -- mix imgproxy.bench "${args[@]}" --cpus 2 --rounds 4 --duration 1 \
            --shard "$SHARD" --output tmp/performance

      - name: Upload the shard's results
        if: ${{ !cancelled() && hashFiles('image_pipe/tmp/performance/results.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-shard-${{ matrix.shard }}
          path: image_pipe/tmp/performance/results.json
          retention-days: 30

  join:
    needs: shard
    if: ${{ !cancelled() && needs.shard.result != 'skipped' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    env:
      # Use only the tools mise-action installs, not every tool in mise.toml.
      MISE_EXEC_AUTO_INSTALL: "false"
      # The bench decodes responses only to compare their dimensions, so the
      # libvips bundled with vix is enough; the servers run their own.
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: performance-shard-*
          path: ${{ runner.temp }}/shards

      - name: Runner image
        id: runner
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          # Workaround: mise (2026.9.18) maps ImageOS to builds.hex.pm's Erlang
          # builds only up to ubuntu24 and compiles from source otherwise, so
          # name the release. Remove once mise maps ubuntu26 itself.
          echo "MISE_ERLANG_PRECOMPILED_OS=${ImageOS/ubuntu/ubuntu-}.04" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: erlang elixir rust
      - name: Install Hex and Rebar
        run: |
          mise exec -- mix local.hex --force
          mise exec -- mix local.rebar --force
      - name: Restore deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            image_pipe/deps
            image_pipe/_build
          key: perf-mix-${{ steps.runner.outputs.image }}-${{ hashFiles('mise.toml', 'image_pipe/mix.lock') }}
          restore-keys: |
            perf-mix-${{ steps.runner.outputs.image }}-
      - name: Compile the bench
        working-directory: image_pipe
        run: |
          mise exec -- mix deps.get
          mise exec -- mix compile

      - name: Merge the shards
        working-directory: image_pipe
        run: |
          shopt -s nullglob
          args=()
          for dir in "$RUNNER_TEMP"/shards/*/; do args+=(--merge "$dir"); done
          # Without a shard, the bench would run instead of merging.
          if [ ${#args[@]} -eq 0 ]; then echo "No shard finished" >&2; exit 1; fi
          mise exec -- mix imgproxy.bench "${args[@]}" --output tmp/performance
          cat tmp/performance/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the report
        if: ${{ !cancelled() && hashFiles('image_pipe/tmp/performance/index.html') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-report
          path: |
            image_pipe/tmp/performance/index.html
            image_pipe/tmp/performance/results.json
          retention-days: 30

      # A pull request from a fork gets a read-only token, so its comment is
      # skipped; the job summary still has the table.
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body-file image_pipe/tmp/performance/summary.md \
            --edit-last --create-if-none
