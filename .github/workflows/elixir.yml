name: Elixir CI

on:
  push:
    branches: ["main"]
    paths: &elixir_paths
      - "lib/**"
      - "test/**"
      - "priv/**"
      - "config/**"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/elixir.yml"
  pull_request:
    branches: ["main"]
    paths: *elixir_paths

permissions:
  contents: read

jobs:
  build:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.erlang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: 1.18.4-otp-27
            erlang: 27
          - elixir: 1.18.4-otp-28
            erlang: 28
          - elixir: 1.19.5-otp-27
            erlang: 27
          - elixir: 1.19.5-otp-28
            erlang: 28
          - elixir: 1.20.0-otp-27
            erlang: 27
          - elixir: 1.20.0-otp-28
            erlang: 28

    # JPEG XL output is a first-class format, but the precompiled libvips vix
    # downloads by default (sharp-libvips) ships without libjxl save, while the
    # newest apt libvips with JXL (Ubuntu noble, 8.15.1) is too old for ops this
    # codebase uses (clamp/maxpair, libvips >= 8.16). So build a current libvips
    # with libjxl from source and compile vix against it
    # (VIX_COMPILATION_MODE=PLATFORM_PROVIDED_LIBVIPS) — JXL runs for real.
    env:
      VIX_COMPILATION_MODE: PLATFORM_PROVIDED_LIBVIPS
      VIPS_VERSION: "8.18.2"
      VIPS_PREFIX: /opt/vips
      PKG_CONFIG_PATH: /opt/vips/lib/pkgconfig
      LD_LIBRARY_PATH: /opt/vips/lib

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          mise_toml: |
            [tools]
            erlang = "${{ matrix.erlang }}"
            elixir = "${{ matrix.elixir }}"
      - name: Install libvips build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config \
            libglib2.0-dev libexpat1-dev libjpeg-turbo8-dev libpng-dev \
            libwebp-dev libtiff-dev libgif-dev libheif-dev librsvg2-dev \
            liborc-0.4-dev liblcms2-dev libjxl-dev libcgif-dev \
            libheif-plugin-aomenc libheif-plugin-aomdec
      - name: Cache libvips build
        id: cache-vips
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.VIPS_PREFIX }}
          key: vips-${{ runner.os }}-${{ env.VIPS_VERSION }}-jxl-v1
      - name: Build libvips with JPEG XL
        if: steps.cache-vips.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "https://github.com/libvips/libvips/releases/download/v${VIPS_VERSION}/vips-${VIPS_VERSION}.tar.xz" | tar xJ
          cd "vips-${VIPS_VERSION}"
          meson setup build --prefix="${VIPS_PREFIX}" --libdir=lib --buildtype=release
          meson compile -C build
          sudo meson install -C build
      - name: Verify libvips can write JPEG XL
        run: |
          sudo ldconfig "${VIPS_PREFIX}/lib"
          "${VIPS_PREFIX}/bin/vips" --version
          "${VIPS_PREFIX}/bin/vips" -l | grep -iq jxlsave || { echo "JXL save missing from build"; exit 1; }
      - name: Print versions
        run: mise exec -- elixir --version
      - name: Install Hex
        run: mise exec -- mix local.hex --force
      - name: Install Rebar
        run: mise exec -- mix local.rebar --force
      - name: Install dependencies
        run: mise exec -- mix deps.get
      - name: Compile
        run: mise exec -- mix compile --warnings-as-errors
        env:
          MIX_ENV: test
      - name: Run tests
        run: mise exec -- mix test --no-compile
        env:
          MIX_ENV: test
