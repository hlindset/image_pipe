name: Elixir CI

on:
  push:
    branches: ["main"]
    paths: &elixir_paths
      - "image_pipe_url/lib/**"
      - "image_pipe_url/test/**"
      - "image_pipe_url/mix.exs"
      - "image_pipe_url/mix.lock"
      - "image_pipe/lib/**"
      - "image_pipe/test/**"
      - "image_pipe/priv/**"
      - "image_pipe/config/**"
      - "image_pipe/mix.exs"
      - "image_pipe/mix.lock"
      - "mise.toml"
      - ".github/workflows/elixir.yml"
  pull_request:
    branches: ["main"]
    paths: *elixir_paths

permissions:
  contents: read

jobs:
  url:
    name: image_pipe_url / Elixir ${{ matrix.toolchain.elixir }} / OTP ${{ matrix.toolchain.erlang }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - { elixir: 1.18.5-otp-27, erlang: "27" }
          - { elixir: 1.19.6-otp-28, erlang: "28" }
          - { elixir: 1.20.4-otp-29, erlang: "29.1" }
    env:
      MISE_ERLANG_VERSION: ${{ matrix.toolchain.erlang }}
      MISE_ELIXIR_VERSION: ${{ matrix.toolchain.elixir }}
      MIX_ENV: test
    defaults:
      run:
        working-directory: image_pipe_url
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches holding compiled code are keyed by runner image (e.g. ubuntu26):
      # runner.os is just "Linux", so a runner upgrade would restore binaries
      # built against the previous release's libraries.
      - name: Runner image
        id: runner
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          # mise maps ImageOS to builds.hex.pm's Erlang builds only up to
          # ubuntu24 and compiles from source otherwise; name the release.
          echo "MISE_ERLANG_PRECOMPILED_OS=${ImageOS/ubuntu/ubuntu-}.04" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - name: Install Hex
        run: mise exec -- mix local.hex --force
      - name: Install Rebar
        run: mise exec -- mix local.rebar --force
      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            image_pipe_url/deps
            image_pipe_url/_build
          key: url-mix-${{ steps.runner.outputs.image }}-${{ matrix.toolchain.elixir }}-${{ matrix.toolchain.erlang }}-${{ hashFiles('image_pipe_url/mix.lock') }}
          restore-keys: |
            url-mix-${{ steps.runner.outputs.image }}-${{ matrix.toolchain.elixir }}-${{ matrix.toolchain.erlang }}-
      - name: Install dependencies
        run: mise exec -- mix deps.get
      - name: Compile
        run: mise exec -- mix compile --warnings-as-errors
      - name: Run tests
        run: mise exec -- mix test --no-compile

  build:
    name: Elixir ${{ matrix.toolchain.elixir }} / OTP ${{ matrix.toolchain.erlang }} (${{ matrix.partition }}/3)
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        toolchain:
          - { elixir: 1.18.5-otp-27, erlang: "27" }
          - { elixir: 1.19.6-otp-28, erlang: "28" }
          - { elixir: 1.20.4-otp-29, erlang: "29.1" }
        partition: [1, 2, 3]

    # Build current libvips for clamp/maxpair, PNG palette quantization, and
    # JPEG XL source decoding. Compile vix against the same build.
    env:
      MISE_ERLANG_VERSION: ${{ matrix.toolchain.erlang }}
      MISE_ELIXIR_VERSION: ${{ matrix.toolchain.elixir }}
      VIX_COMPILATION_MODE: PLATFORM_PROVIDED_LIBVIPS
      VIPS_VERSION: "8.18.7"
      # Upstream SHA256 of vips-${VIPS_VERSION}.tar.xz (release .sha256sum asset).
      VIPS_SHA256: "5baaead3b0bb20ffdb9e9ff09aa9fda08620923df77b63b436654cb5e0b3bf94"
      # Runner-writable prefix: install runs as the runner user (no sudo), so the
      # cached tree isn't root-owned and restores cleanly. LD_LIBRARY_PATH below
      # makes the loader find libvips without ldconfig.
      VIPS_PREFIX: ${{ github.workspace }}/.vips
      PKG_CONFIG_PATH: ${{ github.workspace }}/.vips/lib/pkgconfig
      LD_LIBRARY_PATH: ${{ github.workspace }}/.vips/lib

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Caches holding compiled code are keyed by runner image (e.g. ubuntu26):
      # runner.os is just "Linux", so a runner upgrade would restore binaries
      # built against the previous release's libraries.
      - name: Runner image
        id: runner
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          # mise maps ImageOS to builds.hex.pm's Erlang builds only up to
          # ubuntu24 and compiles from source otherwise; name the release.
          echo "MISE_ERLANG_PRECOMPILED_OS=${ImageOS/ubuntu/ubuntu-}.04" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      # Downloaded packages are cached so a slow or failing Ubuntu mirror only
      # affects the package index fetch. Only the first matrix job saves.
      - name: Restore apt packages
        id: apt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-${{ steps.runner.outputs.image }}-${{ hashFiles('.github/workflows/elixir.yml') }}
          restore-keys: |
            apt-${{ steps.runner.outputs.image }}-
      - name: Install libvips build and runtime dependencies
        run: |
          # The runner is throwaway, so skip dpkg's fsyncs and the man-db
          # index rebuild.
          echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/force-unsafe-io >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true \
            build-essential meson ninja-build pkg-config \
            libglib2.0-dev libexpat1-dev libjpeg-turbo8-dev libpng-dev \
            libwebp-dev libtiff-dev libgif-dev libheif-dev librsvg2-dev \
            liborc-0.4-dev liblcms2-dev libjxl-dev libcgif-dev libexif-dev \
            libheif-plugin-aomenc libheif-plugin-aomdec libimagequant-dev
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
      - name: Save apt packages
        if: strategy.job-index == 0 && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: Cache libvips build
        id: cache-vips
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.VIPS_PREFIX }}
          key: vips-${{ steps.runner.outputs.image }}-${{ env.VIPS_VERSION }}-jxl-exif-quant-v4
      - name: Build libvips with JPEG XL decoding + PNG quantization
        if: steps.cache-vips.outputs.cache-hit != 'true'
        run: |
          tarball="vips-${VIPS_VERSION}.tar.xz"
          curl -fsSL -o "${tarball}" "https://github.com/libvips/libvips/releases/download/v${VIPS_VERSION}/${tarball}"
          echo "${VIPS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar xJf "${tarball}"
          cd "vips-${VIPS_VERSION}"
          # -Dimagequant=enabled: PNG palette quantization (png_options quantize) —
          # libvips' palette save is a build-time optional.
          meson setup build --prefix="${VIPS_PREFIX}" --libdir=lib --buildtype=release \
            -Dimagequant=enabled
          meson compile -C build
          meson install -C build
      - name: Verify libvips can read JPEG XL and write quantized PNG
        run: |
          "${VIPS_PREFIX}/bin/vips" --version
          "${VIPS_PREFIX}/bin/vips" -l | grep -iq jxlload || { echo "JXL load missing from build"; exit 1; }
          # Functional check: a palette PNG must encode (needs libimagequant).
          "${VIPS_PREFIX}/bin/vips" black /tmp/q.v 16 16
          "${VIPS_PREFIX}/bin/vips" pngsave /tmp/q.v /tmp/q.png[palette=true,bitdepth=4] || {
            echo "PNG palette quantization missing from build"; exit 1; }
      - name: Print versions
        run: mise exec -- elixir --version
      - name: Install Hex
        run: mise exec -- mix local.hex --force
      - name: Install Rebar
        run: mise exec -- mix local.rebar --force
      # vix's NIF links against the libvips in VIPS_PREFIX, so the libvips
      # version is part of the key.
      - name: Restore deps and build
        id: mix-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            image_pipe/deps
            image_pipe/_build
          key: mix-${{ steps.runner.outputs.image }}-${{ matrix.toolchain.elixir }}-${{ matrix.toolchain.erlang }}-vips${{ env.VIPS_VERSION }}-${{ hashFiles('image_pipe/mix.lock') }}
          restore-keys: |
            mix-${{ steps.runner.outputs.image }}-${{ matrix.toolchain.elixir }}-${{ matrix.toolchain.erlang }}-vips${{ env.VIPS_VERSION }}-
      - name: Install dependencies
        working-directory: image_pipe
        run: mise exec -- mix deps.get
      - name: Compile
        working-directory: image_pipe
        run: mise exec -- mix compile --warnings-as-errors
        env:
          MIX_ENV: test
      # One partition saves, before tests run, so a failing test run still
      # leaves a warm cache.
      - name: Save deps and build
        if: matrix.partition == 1 && steps.mix-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            image_pipe/deps
            image_pipe/_build
          key: ${{ steps.mix-cache.outputs.cache-primary-key }}
      - name: Run tests
        working-directory: image_pipe
        run: mise exec -- mix test --no-compile --partitions 3
        env:
          MIX_ENV: test
          MIX_TEST_PARTITION: ${{ matrix.partition }}
