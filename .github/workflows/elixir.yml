name: Elixir CI

on:
  push:
    branches: ["main"]
    paths: &elixir_paths
      - "lib/**"
      - "test/**"
      - "priv/**"
      - "config/**"
      - "mix.exs"
      - "mix.lock"
      - ".github/workflows/elixir.yml"
  pull_request:
    branches: ["main"]
    paths: *elixir_paths

permissions:
  contents: read

jobs:
  build:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.erlang }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: 1.18.4-otp-27
            erlang: 27
          - elixir: 1.18.4-otp-28
            erlang: 28
          - elixir: 1.19.5-otp-27
            erlang: 27
          - elixir: 1.19.5-otp-28
            erlang: 28
          - elixir: 1.20.0-otp-27
            erlang: 27
          - elixir: 1.20.0-otp-28
            erlang: 28

    # JPEG XL output is a first-class format, but the precompiled libvips vix
    # downloads by default (sharp-libvips) ships without libjxl save, while the
    # newest apt libvips with JXL (Ubuntu noble, 8.15.1) is too old for ops this
    # codebase uses (clamp/maxpair, libvips >= 8.16). So build a current libvips
    # with libjxl from source and compile vix against it
    # (VIX_COMPILATION_MODE=PLATFORM_PROVIDED_LIBVIPS) — JXL runs for real.
    env:
      MISE_ERLANG_VERSION: ${{ matrix.erlang }}
      MISE_ELIXIR_VERSION: ${{ matrix.elixir }}
      # The dual-run suites can otherwise drive parallel Vix evaluations into
      # the sporadic native crash tracked in akash-akya/vix#111.
      VIPS_CONCURRENCY: "1"
      VIX_COMPILATION_MODE: PLATFORM_PROVIDED_LIBVIPS
      VIPS_VERSION: "8.18.2"
      # Upstream SHA256 of vips-${VIPS_VERSION}.tar.xz (release .sha256sum asset).
      VIPS_SHA256: "a30d4aede16f1c2899c1a2241870f8a7409feafa38484bcdcdac113d6d6f8ff5"
      # Runner-writable prefix: install runs as the runner user (no sudo), so the
      # cached tree isn't root-owned and restores cleanly. LD_LIBRARY_PATH below
      # makes the loader find libvips without ldconfig.
      VIPS_PREFIX: ${{ github.workspace }}/.vips
      PKG_CONFIG_PATH: ${{ github.workspace }}/.vips/lib/pkgconfig
      LD_LIBRARY_PATH: ${{ github.workspace }}/.vips/lib

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
      - name: Install libvips build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config \
            libglib2.0-dev libexpat1-dev libjpeg-turbo8-dev libpng-dev \
            libwebp-dev libtiff-dev libgif-dev libheif-dev librsvg2-dev \
            liborc-0.4-dev liblcms2-dev libjxl-dev libcgif-dev libexif-dev \
            libheif-plugin-aomenc libheif-plugin-aomdec libimagequant-dev
      - name: Cache libvips build
        id: cache-vips
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.VIPS_PREFIX }}
          key: vips-${{ runner.os }}-${{ env.VIPS_VERSION }}-jxl-exif-quant-v4
      - name: Build libvips with JPEG XL + PNG quantization
        if: steps.cache-vips.outputs.cache-hit != 'true'
        run: |
          tarball="vips-${VIPS_VERSION}.tar.xz"
          curl -fsSL -o "${tarball}" "https://github.com/libvips/libvips/releases/download/v${VIPS_VERSION}/${tarball}"
          echo "${VIPS_SHA256}  ${tarball}" | sha256sum --check --strict
          tar xJf "${tarball}"
          cd "vips-${VIPS_VERSION}"
          # -Dimagequant=enabled: PNG palette quantization (png_options quantize) —
          # libvips' palette save is a build-time optional, like JXL above.
          meson setup build --prefix="${VIPS_PREFIX}" --libdir=lib --buildtype=release \
            -Dimagequant=enabled
          meson compile -C build
          meson install -C build
      - name: Verify libvips can write JPEG XL + quantized PNG
        run: |
          "${VIPS_PREFIX}/bin/vips" --version
          "${VIPS_PREFIX}/bin/vips" -l | grep -iq jxlsave || { echo "JXL save missing from build"; exit 1; }
          # Functional check: a palette PNG must encode (needs libimagequant).
          "${VIPS_PREFIX}/bin/vips" black /tmp/q.v 16 16
          "${VIPS_PREFIX}/bin/vips" pngsave /tmp/q.v /tmp/q.png[palette=true,bitdepth=4] || {
            echo "PNG palette quantization missing from build"; exit 1; }
      - name: Print versions
        run: mise exec -- elixir --version
      - name: Install Hex
        run: mise exec -- mix local.hex --force
      - name: Install Rebar
        run: mise exec -- mix local.rebar --force
      - name: Install dependencies
        run: mise exec -- mix deps.get
      - name: Compile
        run: mise exec -- mix compile --warnings-as-errors
        env:
          MIX_ENV: test
      - name: Run tests
        run: mise exec -- mix test --no-compile
        env:
          MIX_ENV: test
