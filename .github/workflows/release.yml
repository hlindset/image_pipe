name: Library release

# A vX.Y.Z tag publishes image_pipe_url and image_pipe at that version to Hex
# and creates a GitHub release. Running the workflow by hand from any branch is
# a dry run that builds and checks both packages without publishing. Server
# images release separately (release-server.yml).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Project versions agree
        if: github.event_name == 'workflow_dispatch'
        run: scripts/check-versions.sh libraries
      - name: Tag matches the libraries, is on main, and has release notes
        if: github.event_name == 'push'
        run: |
          scripts/check-versions.sh libraries "${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          scripts/changelog-notes.sh libraries "${GITHUB_REF_NAME#v}" > /dev/null

  hex:
    name: Hex packages
    needs: verify
    runs-on: ubuntu-26.04
    env:
      # Use only the tools mise-action installs, not every tool in mise.toml.
      MISE_EXEC_AUTO_INSTALL: "false"
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    environment: ${{ github.event_name == 'push' && 'release' || 'release-dry-run' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Workaround: mise (2026.9.18) maps ImageOS to builds.hex.pm's Erlang
      # builds only up to ubuntu24 and compiles from source otherwise, so name
      # the release. Remove once mise maps ubuntu26 itself
      # (linux_precompiled_os_version in src/plugins/core/erlang.rs).
      - name: Precompiled Erlang
        run: echo "MISE_ERLANG_PRECOMPILED_OS=${ImageOS/ubuntu/ubuntu-}.04" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: erlang elixir rust
      - name: Install Hex
        run: mise exec -- mix local.hex --force
      - name: Install Rebar
        run: mise exec -- mix local.rebar --force
      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: mise run release:hex --dry-run
      - name: Publish
        if: github.event_name == 'push'
        run: mise run release:hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  github-release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: hex
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/changelog-notes.sh libraries "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
