name: Release

# A vX.Y.Z tag publishes that version: Hex packages, server images on GHCR, and
# a GitHub release. Running the workflow by hand from any branch is a dry run
# that builds and checks everything without publishing.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/image_pipe_server

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Projects share a version
        if: github.event_name == 'workflow_dispatch'
        run: scripts/check-versions.sh
      - name: Tag matches the projects, is on main, and has release notes
        if: github.event_name == 'push'
        run: |
          scripts/check-versions.sh "${GITHUB_REF_NAME#v}"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          scripts/changelog-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

  # Builds and smoke-tests each variant on native runners, then pushes it by
  # digest only. Tags are added after Hex publishing succeeds.
  image:
    name: Image (${{ matrix.variant }}, ${{ matrix.platform.arch }})
    needs: verify
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [base, vision]
        platform:
          # amd64 reads the layer cache Server image CI writes on main.
          - { arch: amd64, runner: ubuntu-26.04, cache: "" }
          - { arch: arm64, runner: ubuntu-26.04-arm, cache: "-arm64" }
    env:
      CACHE_SCOPE: server-${{ matrix.variant }}${{ matrix.platform.cache }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
            suffix=${{ matrix.variant == 'vision' && '-vision' || '' }},onlatest=true
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image_pipe_server/Dockerfile
          build-args: IMAGE_VISION=${{ matrix.variant == 'vision' && '1' || '0' }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: image_pipe_server:release
          load: true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
          # A tag can read caches from main but its own writes are unreachable
          # by later runs, so only a manual run (e.g. on main) warms the cache.
          cache-to: ${{ github.event_name == 'workflow_dispatch' && format('type=gha,scope={0},mode=max', env.CACHE_SCOPE) || '' }}
      - name: Smoke test
        run: image_pipe_server/test/container/smoke.sh image_pipe_server:release ${{ matrix.variant }}
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        if: github.event_name == 'push'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image_pipe_server/Dockerfile
          build-args: IMAGE_VISION=${{ matrix.variant == 'vision' && '1' || '0' }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.CACHE_SCOPE }}
      - name: Record digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - name: Upload digest
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.platform.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  hex:
    name: Hex packages
    needs: [verify, image]
    runs-on: ubuntu-26.04
    environment: ${{ github.event_name == 'push' && 'release' || 'release-dry-run' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Workaround: mise (2026.9.18) maps ImageOS to builds.hex.pm's Erlang
      # builds only up to ubuntu24 and compiles from source otherwise, so name
      # the release. Remove once mise maps ubuntu26 itself
      # (linux_precompiled_os_version in src/plugins/core/erlang.rs).
      - name: Precompiled Erlang
        run: echo "MISE_ERLANG_PRECOMPILED_OS=${ImageOS/ubuntu/ubuntu-}.04" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: erlang elixir
      - name: Install Hex
        run: mise exec -- mix local.hex --force
      - name: Install Rebar
        run: mise exec -- mix local.rebar --force
      - name: Dry run
        if: github.event_name == 'workflow_dispatch'
        run: mise run release:hex --dry-run
      - name: Publish
        if: github.event_name == 'push'
        run: mise run release:hex
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

  # Joins each variant's per-architecture digests into one tagged manifest list.
  tag-images:
    name: Tag images (${{ matrix.variant }})
    if: github.event_name == 'push'
    needs: hex
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        variant: [base, vision]
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-${{ matrix.variant }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
            suffix=${{ matrix.variant == 'vision' && '-vision' || '' }},onlatest=true
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest lists
        working-directory: ${{ runner.temp }}/digests
        run: |
          args=()
          while IFS= read -r tag; do args+=(--tag "$tag"); done \
            < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          while IFS= read -r annotation; do args+=(--annotation "$annotation"); done \
            < <(jq -r '.annotations[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          for digest in *; do args+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}"
      - name: Inspect
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

  github-release:
    name: GitHub release
    if: github.event_name == 'push'
    needs: tag-images
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/changelog-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
