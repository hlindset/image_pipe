name: Lint

on:
  push:
    branches: ["main"]
    paths: &lint_paths
      - "image_pipe_url/lib/**"
      - "image_pipe_url/test/**"
      - "image_pipe_url/.formatter.exs"
      - "image_pipe_url/.credo.exs"
      - "image_pipe_url/mix.exs"
      - "image_pipe_url/mix.lock"
      - "image_pipe/lib/**"
      - "image_pipe/test/**"
      - "image_pipe/config/**"
      - "fiddle/**"
      - "image_pipe/.formatter.exs"
      - "image_pipe/.credo.exs"
      - "image_pipe/mix.exs"
      - "image_pipe/mix.lock"
      - "mise.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    branches: ["main"]
    paths: *lint_paths

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-26.04
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The deps and PLT caches are keyed by runner image (e.g. ubuntu26): the
      # deps hold compiled NIFs (ortex, exla), and Dialyzer rejects a PLT
      # written by the Erlang installed on another image.
      - name: Runner image
        id: runner
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          # mise maps ImageOS to builds.hex.pm's Erlang builds only up to
          # ubuntu24 and compiles from source otherwise; name the release.
          echo "MISE_ERLANG_PRECOMPILED_OS=${ImageOS/ubuntu/ubuntu-}.04" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          mise_toml: |
            [tools]
            erlang = "29.1"
            elixir = "1.20.4-otp-29"
            node = "26.9.0"
            pnpm = "12.4.2"
      - name: Install Hex
        run: mise exec -- mix local.hex --force
      - name: Install Rebar
        run: mise exec -- mix local.rebar --force
      # The fiddle's Rust build tree and unpacked XLA archive stay out: the
      # compiled ortex and exla in _build are all formatting and Credo need.
      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            image_pipe_url/deps
            image_pipe_url/_build
            image_pipe/deps
            image_pipe/_build
            fiddle/deps
            fiddle/_build
            !fiddle/deps/ortex/native/ortex/target
            !fiddle/deps/exla/cache/xla_extension
          key: lint-mix-${{ steps.runner.outputs.image }}-erlang29.1-elixir1.20.4-otp29-${{ hashFiles('image_pipe_url/mix.lock', 'image_pipe/mix.lock', 'fiddle/mix.lock') }}
          restore-keys: |
            lint-mix-${{ steps.runner.outputs.image }}-erlang29.1-elixir1.20.4-otp29-
      - name: Install image_pipe_url dependencies
        working-directory: image_pipe_url
        run: mise exec -- mix deps.get
      - name: Install library dependencies
        working-directory: image_pipe
        run: mise exec -- mix deps.get
      - name: Install fiddle Elixir dependencies
        run: cd fiddle && mise exec -- mix deps.get
      - name: Install fiddle JS dependencies
        run: mise exec -- pnpm -C fiddle install --frozen-lockfile
      - name: Check image_pipe_url formatting
        working-directory: image_pipe_url
        run: mise exec -- mix format --check-formatted
      - name: Run image_pipe_url Credo
        working-directory: image_pipe_url
        run: mise exec -- mix credo --strict
      - name: Restore image_pipe_url PLT cache
        id: url-plt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: image_pipe_url/priv/plts
          key: url-plt-dev-${{ steps.runner.outputs.image }}-erlang29.1-elixir1.20.4-otp29-${{ hashFiles('image_pipe_url/mix.lock') }}
          restore-keys: |
            url-plt-dev-${{ steps.runner.outputs.image }}-erlang29.1-elixir1.20.4-otp29-
      - name: Create image_pipe_url PLTs
        if: steps.url-plt-cache.outputs.cache-hit != 'true'
        working-directory: image_pipe_url
        run: mise exec -- mix dialyzer --plt
        env:
          MIX_ENV: dev
      - name: Run image_pipe_url Dialyzer
        working-directory: image_pipe_url
        run: mise exec -- mix dialyzer
        env:
          MIX_ENV: dev
      - name: Check library formatting
        working-directory: image_pipe
        run: mise exec -- mix format --check-formatted
      - name: Run Credo
        working-directory: image_pipe
        run: mise exec -- mix credo --strict
      - name: Restore PLT cache
        id: plt-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: image_pipe/priv/plts
          # image_pipe_url is a path dependency, so it never appears in
          # mix.lock. Its sources are part of the key, and there is no
          # restore-keys fallback: dialyxir judges PLT freshness by the lock
          # alone and would keep a stale PLT from a partial match.
          key: plt-dev-${{ steps.runner.outputs.image }}-erlang29.1-elixir1.20.4-otp29-${{ hashFiles('image_pipe/mix.lock', 'image_pipe_url/mix.exs', 'image_pipe_url/lib/**/*.ex') }}
      - name: Create PLTs
        if: steps.plt-cache.outputs.cache-hit != 'true'
        working-directory: image_pipe
        run: mise exec -- mix dialyzer --plt
        env:
          MIX_ENV: dev
      - name: Run Dialyzer
        working-directory: image_pipe
        run: mise exec -- mix dialyzer
        env:
          MIX_ENV: dev
      - name: Check fiddle formatting
        run: cd fiddle && mise exec -- mix format --check-formatted
      - name: Fiddle type-check
        run: mise exec -- pnpm -C fiddle/assets run check
      - name: Fiddle format check
        run: mise exec -- pnpm -C fiddle/assets run format:check
      - name: Fiddle lint
        run: mise exec -- pnpm -C fiddle/assets run lint
      - name: Fiddle tests
        run: mise exec -- pnpm -C fiddle/assets run test
      - name: Build fiddle assets and service worker
        run: mise exec -- pnpm -C fiddle/assets run build
