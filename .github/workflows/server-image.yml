name: Server image

# Builds the release images, which compile the sibling projects, whenever
# their code, manifests, or the server's own files change.
on:
  push:
    branches: ["main"]
    paths: &image_paths
      - "image_pipe_url/lib/**"
      - "image_pipe_url/mix.exs"
      - "image_pipe_url/mix.lock"
      - "image_pipe/lib/**"
      - "image_pipe/priv/icc/**"
      - "image_pipe/mix.exs"
      - "image_pipe/mix.lock"
      - "image_pipe_svg/lib/**"
      - "image_pipe_svg/native/**"
      - "image_pipe_svg/mix.exs"
      - "image_pipe_svg/mix.lock"
      - "image_pipe_server/**"
      - "!image_pipe_server/docs/**"
      - "!image_pipe_server/**/*.md"
      - "!image_pipe_server/test/image_pipe_server/**"
      - ".github/workflows/server-image.yml"
      - ".github/actions/docker-buildx/**"
  pull_request:
    branches: ["main"]
    paths: *image_paths
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

# A push to a pull request, or adding or removing its skip-tests label, cancels
# the run in progress. Other label events and pushes to main get a group of
# their own.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event_name == 'pull_request'
    && (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || github.event.label.name == 'skip-tests')
    && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  # Each architecture builds on its own native runner, like the release. The
  # cache scopes match the ones the release reads for the sibling projects.
  image:
    name: Docker image (${{ matrix.variant }}, ${{ matrix.platform.arch }})
    # Skipped on a pull request labeled skip-tests and on events for other labels.
    if: >-
      github.event_name != 'pull_request'
      || !contains(github.event.pull_request.labels.*.name, 'skip-tests')
      && (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || github.event.label.name == 'skip-tests')
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        variant: [base, vision]
        platform:
          - { arch: amd64, runner: ubuntu-26.04, cache: "" }
          - { arch: arm64, runner: ubuntu-26.04-arm, cache: "-arm64" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/docker-buildx
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image_pipe_server/Dockerfile
          build-args: IMAGE_VISION=${{ matrix.variant == 'vision' && '1' || '0' }}
          tags: image_pipe_server:ci
          load: true
          cache-from: type=gha,scope=server-${{ matrix.variant }}${{ matrix.platform.cache }}
          cache-to: type=gha,scope=server-${{ matrix.variant }}${{ matrix.platform.cache }},mode=max
      - name: Smoke test
        run: image_pipe_server/test/container/smoke.sh image_pipe_server:ci ${{ matrix.variant }}
