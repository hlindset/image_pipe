name: Server image

# Library and server code is compiled and tested by Server CI on every change;
# this builds the release images only when something that shapes them changes.
on:
  push:
    branches: ["main"]
    paths: &image_paths
      - "image_pipe_url/mix.exs"
      - "image_pipe_url/mix.lock"
      - "image_pipe/priv/icc/**"
      - "image_pipe/mix.exs"
      - "image_pipe/mix.lock"
      - "image_pipe_server/**"
      - ".github/workflows/server-image.yml"
  pull_request:
    branches: ["main"]
    paths: *image_paths

permissions:
  contents: read

jobs:
  image:
    name: Docker image (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant: [base, vision]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: image_pipe_server/Dockerfile
          build-args: IMAGE_VISION=${{ matrix.variant == 'vision' && '1' || '0' }}
          tags: image_pipe_server:ci
          load: true
          cache-from: type=gha,scope=server-${{ matrix.variant }}
          cache-to: type=gha,scope=server-${{ matrix.variant }},mode=max
      - name: Smoke test
        run: image_pipe_server/test/container/smoke.sh image_pipe_server:ci ${{ matrix.variant }}
