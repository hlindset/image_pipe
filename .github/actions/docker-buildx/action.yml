name: Docker Buildx through a Docker Hub mirror
description: >-
  Sets up Docker Buildx and pulls Docker Hub images anonymously through
  mirror.gcr.io instead of the rate-limited Docker Hub account shared by
  GitHub-hosted runners. An image the mirror doesn't have falls back to
  Docker Hub.

runs:
  using: composite
  steps:
    # The daemon pulls the BuildKit image and runs the smoke tests' containers.
    - name: Use the mirror.gcr.io Docker Hub mirror
      shell: bash
      run: |
        # The daemon forwards Docker Hub credentials to the mirror, which rejects them.
        docker logout
        config=/etc/docker/daemon.json
        current=$(sudo cat "$config" 2>/dev/null || echo '{}')
        jq '."registry-mirrors" = ["https://mirror.gcr.io"]' <<<"$current" | sudo tee "$config" >/dev/null
        sudo systemctl restart docker
        docker info --format '{{.RegistryConfig.Mirrors}}'
    # BuildKit runs in its own container and pulls the Dockerfile's base
    # images itself, so it needs the mirror in its own configuration.
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        buildkitd-config-inline: |
          [registry."docker.io"]
            mirrors = ["mirror.gcr.io"]
